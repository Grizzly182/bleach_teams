<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Game UI Fullscreen</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.slim.js"
      integrity="sha256-M+GjhMBfXikM1izMplICCTscIj5hzPCp6uDzaypxtgg="
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
    <script src="character.js"></script>
    <script src="characters.js"></script>
  </head>
  <body>
    <div class="game-screen">
      <div class="floor-grid"></div>

      <div class="header">
        <div class="header-left"><span>☠</span> Порядок</div>
        <!-- <div class="header-center">
          <span>🔥</span> Рэиацу <span style="color: #d32f2f">654 481 717</span>
        </div> -->
        <div class="right-sidebar-toggle">☰</div>
      </div>

      <div class="sidebar-left">
        <div class="menu-btn"><span>Порядок</span></div>
        <div class="menu-btn"><span>Альбом</span></div>
        <div class="menu-btn"><span>Узы</span></div>
        <div class="menu-btn"><span>Трениров.</span></div>
      </div>

      <div class="stage">
      </div>

      <div class="sidebar-right">
        
      </div>

      <div class="footer-action">
        <div class="battle-btn">
          <span>БОЕВОЙ СТРОЙ ➦</span>
        </div>
      </div>
    </div>
  </body>
</html>
